[package]
name = "ronin_rewards"
version = "0.1.0"
description = "Ronin Rewards Solana program — pays SOL to users who claim Samurai Points rewards"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "ronin_rewards"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = "0.30.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("custom"))'] }
